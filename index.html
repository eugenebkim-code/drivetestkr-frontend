<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Экзамен на права в Корее</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <!--
      Runs before any part of the app bundle (including its dependencies'
      own module-level code) evaluates, so it catches errors that happen
      too early for a handler registered inside main.ts to see — there's no
      way to attach devtools to a user's real Telegram session, so a silent
      failure here is otherwise undebuggable.
    -->
    <script>
      (function () {
        function showFatalError(message) {
          var el = document.getElementById("app");
          if (!el) return;
          var esc = String(message).replace(/[<>&]/g, function (c) {
            return { "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c];
          });
          el.innerHTML =
            '<div style="padding:16px;background:#fff;color:#c00;font-family:monospace;font-size:13px;white-space:pre-wrap;word-break:break-word;">' +
            "Ошибка запуска приложения:\n\n" +
            esc +
            "</div>";
        }
        window.__showFatalError = showFatalError;

        // capture:true so this also catches resource load failures (a
        // <script> tag that 404s or is blocked fires 'error' only on the
        // capture phase — it never bubbles to a plain window listener).
        window.addEventListener(
          "error",
          function (e) {
            if (e.target && e.target.tagName === "SCRIPT") {
              showFatalError("Script failed to load: " + (e.target.src || "(inline)"));
              return;
            }
            showFatalError((e.message || "unknown error") + "\n" + (e.error && e.error.stack ? e.error.stack : ""));
          },
          true,
        );
        window.addEventListener("unhandledrejection", function (e) {
          showFatalError(String(e.reason));
        });

        // Telegram shows its own native placeholder over the page until
        // ready() is called — if the app bundle below throws before its own
        // (later) ready() call, that placeholder never lifts and whatever
        // *did* render (including the error box above) stays hidden behind
        // it forever. Call it immediately so at minimum something becomes
        // visible; the app calls it again once mounted, which is harmless.
        try {
          if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
          }
        } catch (e) {
          showFatalError("ready() failed: " + e);
        }

        // Last-resort: if main.ts never even starts executing (module
        // silently skipped/blocked) or starts but never finishes mounting,
        // neither the error nor unhandledrejection listeners above have
        // anything to catch — there's simply nothing telling us why. This
        // makes that specific silent-failure mode visible too.
        setTimeout(function () {
          if (!window.__appMounted) {
            showFatalError(
              "Таймаут: приложение не смонтировалось за 5 секунд.\n" +
                "main.ts started: " + !!window.__mainTsStarted + "\n" +
                "user agent: " + navigator.userAgent,
            );
          }
        }, 5000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
